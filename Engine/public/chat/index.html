<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<!--
  /chat — talk to the Assistant, on any model Cloudflare runs, and put several side by side.

  One conversation is a grid. Your messages are full-width rows. Under each one is a row of answers,
  one column per AI ("lane"). With one lane it's an ordinary chat; "+ Add AI" adds a column and that
  model answers your latest message straight away; ✕ on a column stops it — its column stays (so every
  row still lines up as you scroll sideways) but it gets nothing new. Each AI sees your messages and its
  OWN earlier answers; one that joined late sees the first column's answers for the rows it missed.

  Server: POST /api/chat {project:"general", model, messages, stream} (the Assistant's prompt and
  firewall, the model checked against GET /api/models), and /api/chats?bot=general for history.
  Sign-in is the main page's: same browser key (localStorage byo:device).
-->
<style>
  :root { --accent:#10a37f; --bg:#ffffff; --panel:#f4f4f5; --text:#0d0d0d; --muted:#6b6b6b; --edge:#e5e5e5; --danger:#b42318; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f0f10; --panel:#1c1c1e; --text:#ececec; --muted:#9a9a9a; --edge:#2c2c2e; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { min-height:100dvh; }
  button { font:inherit; border:0; border-radius:12px; padding:10px 14px; background:var(--panel); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; font-weight:600; }
  button.ghost { background:transparent; color:var(--muted); }
  button:disabled { opacity:.5; cursor:default; }
  input, textarea { font:inherit; color:var(--text); }
  a { color:var(--accent); }
  .muted { color:var(--muted); } .small { font-size:13px; }

  .sitebar { position:sticky; top:0; z-index:8; display:flex; align-items:center; gap:10px; padding:9px 16px; padding-top:calc(9px + env(safe-area-inset-top)); background:var(--bg); border-bottom:1px solid var(--edge); font-size:13px; }
  .siteback { color:var(--text); text-decoration:none; font-weight:600; }
  .sitehere { color:var(--muted); } .sitehere::before { content:"·"; margin-right:10px; }
  .sitebar .sp { flex:1; }
  .sitebar button { padding:6px 10px; font-size:13px; }

  /* the column headers: one per AI, scrolled sideways together with the answers */
  .lanes { position:sticky; top:calc(38px + env(safe-area-inset-top)); z-index:7; background:var(--bg); border-bottom:1px solid var(--edge); overflow:hidden; }
  .lanes .strip { display:flex; gap:10px; padding:8px 16px; width:max-content; }
  .lane { flex:none; display:flex; align-items:center; gap:6px; background:var(--panel); border-radius:12px; padding:6px 6px 6px 12px; min-width:0; }
  .lane b { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .lane small { color:var(--muted); font-size:11.5px; white-space:nowrap; }
  .lane .x { padding:4px 9px; background:transparent; color:var(--muted); font-size:15px; }
  .lane.stopped { opacity:.5; } .lane.stopped b { text-decoration:line-through; }
  .lane button.swap { background:transparent; padding:0; text-align:left; flex:1; min-width:0; display:flex; flex-direction:column; }
  .addlane { flex:none; border:1px dashed var(--edge); background:transparent; color:var(--accent); font-weight:600; padding:8px 14px; }

  /* the conversation: one sideways-scrolling grid, so every answer row lines up */
  .grid { overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x proximity; padding:4px 0 calc(150px + env(safe-area-inset-bottom)); }
  .grid::-webkit-scrollbar { height:6px; } .grid::-webkit-scrollbar-thumb { background:var(--edge); border-radius:3px; }
  .rows { width:max-content; min-width:100%; }
  .prompt { position:sticky; left:0; padding:14px 16px 6px; display:flex; justify-content:flex-end; }
  .promptin { display:flex; justify-content:flex-end; width:100%; }
  .prompt .bub { background:var(--panel); border-radius:18px; padding:10px 14px; max-width:min(640px, 85%); white-space:pre-wrap; overflow-wrap:anywhere; }
  .answers { display:flex; gap:10px; padding:6px 16px; align-items:stretch; }
  /* one AI: an ordinary chat, centred */
  /* One AI: the column is centred, and the model name, your messages and the ＋ line up with it. */
  .rows.one .answers { padding-left:var(--lead, 16px); }
  .rows.one .prompt { padding-left:var(--lead, 16px); justify-content:flex-start; }
  .rows.one .promptin { width:var(--cw); }
  .lanes.one .strip { padding-left:var(--lead, 16px); }
  .cell { flex:none; scroll-snap-align:start; scroll-margin-left:16px; border-radius:14px; padding:10px 12px; min-height:48px; overflow-wrap:anywhere; position:relative; }
  .multi .cell { border:1px solid var(--edge); }
  .cell .who { font-size:11.5px; color:var(--muted); margin-bottom:4px; font-weight:600; letter-spacing:.01em; }
  .cell.plus { width:52px; flex:none; display:flex; align-items:flex-start; justify-content:center; padding:0; border:0; min-height:0; }
  .cell.plus button, .lanes .plus { width:44px; height:44px; padding:0; border-radius:50%; border:1px dashed var(--accent); background:transparent; color:var(--accent); font-size:22px; line-height:1; flex:none; }
  .cell.empty { border-style:dashed; color:var(--muted); font-size:13px; display:flex; align-items:center; justify-content:center; }
  .cell.err { color:var(--danger); }
  .cell .foot { display:flex; gap:8px; align-items:center; margin-top:6px; font-size:12px; color:var(--muted); }
  .cell .foot button { padding:3px 8px; font-size:12px; background:transparent; color:var(--muted); border:1px solid var(--edge); }
  .md p { margin:0 0 .6em; } .md p:last-child { margin-bottom:0; }
  .md ul, .md ol { margin:.2em 0 .6em; padding-left:1.3em; }
  .md pre { background:var(--panel); border-radius:10px; padding:10px; overflow-x:auto; font-size:13px; }
  .md code { font:13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--panel); border-radius:5px; padding:1px 4px; }
  .md pre code { background:none; padding:0; }
  .md h3, .md h4 { margin:.6em 0 .3em; font-size:1em; }
  .dots::after { content:'●●●'; letter-spacing:2px; color:var(--muted); animation:blink 1.2s infinite; font-size:10px; }
  @keyframes blink { 50% { opacity:.25; } }

  .hello { max-width:560px; margin:10vh auto 0; padding:0 16px; text-align:center; }
  .hello h1 { font-size:26px; margin:0 0 6px; }
  .starters { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; }
  .starters button { font-size:14px; border:1px solid var(--edge); background:var(--bg); }

  .dock { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 75%, transparent); z-index:9; }
  .say { max-width:760px; margin:0 auto; background:var(--panel); border:1px solid var(--edge); border-radius:22px; padding:8px 8px 8px 16px; display:flex; align-items:flex-end; gap:6px; }
  .say textarea { flex:1; border:0; background:transparent; resize:none; padding:8px 0; max-height:40vh; outline:none; }
  .say button { width:40px; height:40px; padding:0; border-radius:50%; flex:none; }
  .say .addai { width:auto; height:40px; padding:0 12px; border-radius:999px; border:1px dashed var(--accent); background:transparent; color:var(--accent); font-weight:600; font-size:14px; margin-left:-8px; }
  .say .pic { background:transparent; font-size:18px; }
  .tray { max-width:760px; margin:0 auto 6px; display:flex; gap:8px; flex-wrap:wrap; }
  .tray[hidden] { display:none; }
  .tray .t { position:relative; width:56px; height:56px; border-radius:10px; overflow:hidden; background:var(--panel); }
  .tray .t img { width:100%; height:100%; object-fit:cover; display:block; }
  .tray .t button { position:absolute; top:2px; right:2px; width:20px; height:20px; padding:0; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; font-size:11px; line-height:20px; }
  .bub .pics { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; margin-bottom:6px; }
  .bub .pics img { width:96px; height:96px; object-fit:cover; border-radius:10px; cursor:zoom-in; display:block; }
  .blind { font-size:12px; color:var(--muted); background:var(--panel); border-radius:8px; padding:3px 8px; display:inline-block; margin-bottom:6px; }
  body.dropping .say { outline:2px dashed var(--accent); outline-offset:4px; }
  .say .go { background:var(--accent); color:#fff; font-size:18px; }
  .say .mic { background:transparent; font-size:18px; } .say .mic.rec { background:var(--danger); color:#fff; }
  .hint { max-width:760px; margin:4px auto 0; font-size:12px; color:var(--muted); text-align:center; min-height:1em; }

  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .sheet[hidden] { display:none; }
  .sheet .body { background:var(--bg); width:100%; max-width:560px; max-height:85dvh; overflow:hidden; display:flex; flex-direction:column; border-radius:20px 20px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom)); }
  /* The title, the note and the search stay put; only the list scrolls. */
  .sheet .body > * { flex:none; }
  .sheet .body > .mlist, .sheet .body > .tlist { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; margin:0 -6px; padding:0 6px; }
  @media (min-width:700px) { .sheet { align-items:center; } .sheet .body { border-radius:20px; } }
  .sheet h2 { margin:0 0 10px; font-size:18px; display:flex; justify-content:space-between; align-items:center; }
  .sheet input[type=search] { width:100%; padding:12px; border:1px solid var(--edge); border-radius:12px; background:var(--panel); margin-bottom:10px; }
  .mlist button, .tlist .t { display:flex; width:100%; text-align:left; justify-content:space-between; gap:10px; align-items:center; background:transparent; border-radius:10px; padding:10px; }
  .mlist button:hover, .tlist .t:hover { background:var(--panel); }
  .mlist b { display:block; } .mlist small, .tlist small { color:var(--muted); font-size:12px; display:block; }
  .mlist .price { white-space:nowrap; font-size:12px; color:var(--muted); text-align:right; }
  .tag { display:inline-block; font-size:10.5px; border:1px solid var(--edge); border-radius:6px; padding:0 5px; margin-left:4px; color:var(--muted); vertical-align:1px; }
  .tlist .t { cursor:pointer; } .tlist .t .del { padding:4px 9px; background:transparent; color:var(--muted); }
  .tlist .t.on { background:var(--panel); }
  .signin { max-width:440px; margin:12vh auto; padding:0 16px; text-align:center; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(110px + env(safe-area-inset-bottom)); background:var(--text); color:var(--bg); padding:9px 14px; border-radius:999px; font-size:14px; z-index:30; max-width:90%; }
  .toast[hidden] { display:none; }
</style>
</head>
<body>
<nav class="sitebar">
  <a class="siteback" href="/" title="Back to the bots">← <span id="sitename">The Bot You Own</span></a>
  <span class="sitehere">Chat</span>
  <span class="sp"></span>
  <button id="histbtn" title="Your chats">☰ Chats</button>
  <button id="newbtn" title="Start a new chat">＋ New</button>
</nav>

<div id="signin" class="signin" hidden>
  <h1>Sign in to chat</h1>
  <p class="muted">Chat keeps your conversations, so it needs to know who you are. Sign in once with the Assistant and you'll come straight back here.</p>
  <p><a class="primary" id="signinlink" href="/?project=general&back=/chat" style="display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:12px 18px;border-radius:12px;font-weight:600">Sign in</a></p>
</div>

<div id="main" hidden>
  <div class="lanes" id="lanes"><div class="strip" id="strip"></div></div>
  <div class="grid" id="grid"><div class="rows" id="rows"></div></div>
</div>

<div class="dock" id="dock" hidden>
  <div class="tray" id="tray" hidden></div>
  <form class="say" id="say" autocomplete="off">
    <button type="button" class="pic" id="picbtn" title="Add a picture (or paste / drop one)">🖼</button>
    <input type="file" id="picfile" accept="image/*" multiple hidden>
    <textarea id="input" rows="1" placeholder="Message the Assistant…" maxlength="4000" enterkeyhint="send"></textarea>
    <button type="button" class="mic" id="mic" title="Talk instead of typing — press, speak, press again" hidden>🎤</button>
    <button type="submit" class="go" id="go" title="Send">↑</button>
  </form>
  <div class="hint" id="hint"></div>
</div>

<div class="sheet" id="sheet" hidden><div class="body" id="sheetbody"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const BOT = 'general';
const MAX_LANES = 6;
let DEVICE = ''; try { DEVICE = localStorage.getItem('byo:device') || ''; } catch {}
if (!/^[0-9a-f]{64}$/.test(DEVICE)) { DEVICE = [...crypto.getRandomValues(new Uint8Array(32))].map((b) => b.toString(16).padStart(2, '0')).join(''); try { localStorage.setItem('byo:device', DEVICE); } catch {} }
const H = () => ({ 'x-device-key': DEVICE });

let MODELS = [], DEFAULT_MODEL = '', CFG = {};
let THREADS = [];            // from the server, newest first
let T = null;                // the open chat: { id, title, lanes:[{model, stoppedAt:null|row, from}], rows:[{type:'prompt', text} | {type:'answers', cells:{lane: {text, state, ms}}}] }
const busy = new Set();      // "row:lane" still streaming

function toast(msg, ms = 2600) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, ms); }
const modelOf = (id) => MODELS.find((m) => m.id === id) || { id, name: (id || '').split('/').pop(), maker: '', price: null };
const priceLine = (m) => m.price ? '$' + m.price.in.toFixed(2) + ' in · $' + m.price.out.toFixed(2) + ' out' : 'no price on file';
const newId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const alive = (lane, row) => lane.stoppedAt == null || row < lane.stoppedAt;

// ---------- markdown, the small safe subset models actually use ----------
function md(src) {
  const blocks = String(src || '').split(/```/);
  return blocks.map((b, i) => {
    if (i % 2) { const nl = b.indexOf('\n'); return '<pre><code>' + esc(nl >= 0 ? b.slice(nl + 1) : b).replace(/\n$/, '') + '</code></pre>'; }
    const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    let out = '', list = null;
    const close = () => { if (list) { out += '</' + list + '>'; list = null; } };
    for (const line of b.split('\n')) {
      const ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/), h = line.match(/^#{1,6}\s+(.*)/);
      if (ul || ol) { const want = ul ? 'ul' : 'ol'; if (list !== want) { close(); out += '<' + want + '>'; list = want; } out += '<li>' + inline((ul || ol)[1]) + '</li>'; continue; }
      close();
      if (h) out += '<h4>' + inline(h[1]) + '</h4>';
      else if (line.trim()) out += '<p>' + inline(line) + '</p>';
    }
    close(); return out;
  }).join('');
}

// ---------- layout: how wide a column is ----------
function colWidth() {
  const n = T ? T.lanes.length : 1, W = $('grid').clientWidth - 32;
  if (n <= 1) return Math.min(W, 760);
  const fit = Math.max(1, Math.floor((W + 10) / 330));
  if (n <= fit) return Math.floor((W - 10 * (n - 1)) / n);
  // More columns than fit: a little of the next one shows, so you know to swipe.
  return Math.floor((W - 10 * (fit - 1)) / (fit + 0.15));
}

function render() {
  if (!T) return;
  const cw = colWidth(), multi = T.lanes.length > 1;
  document.documentElement.style.setProperty('--cw', cw + 'px');
  document.documentElement.style.setProperty('--lead', (multi ? 16 : Math.max(16, Math.round(($('grid').clientWidth - cw) / 2))) + 'px');
  $('lanes').classList.toggle('one', !multi);
  $('rows').classList.toggle('multi', multi); $('rows').classList.toggle('one', !multi);
  $('lanes').hidden = false;
  // headers
  const lastRow = T.rows.length;
  $('strip').innerHTML = T.lanes.map((l, i) => {
    const m = modelOf(l.model), stopped = l.stoppedAt != null, answered = T.rows.some((r) => r.type === 'answers' && r.cells[i]?.text);
    return '<div class="lane' + (stopped ? ' stopped' : '') + '" style="width:' + cw + 'px"><button class="swap" data-swap="' + i + '"' + (answered || stopped ? ' disabled style="opacity:1;cursor:default"' : ' title="Pick a different AI for this column"') + '><b>' + esc(m.name) + (m.thinks ? '<span class="tag">thinks</span>' : '') + '</b><small>' + esc(m.maker) + (m.sees ? ' · sees images' : '') + (stopped ? ' · stopped' : '') + '</small></button>'
      + (T.lanes.length > 1 && !stopped ? '<button class="x" data-stop="' + i + '" title="Stop this AI — it gets nothing new; its column stays">✕</button>' : '') + '</div>';
  }).join('');
  const canAdd = T.lanes.filter((l) => l.stoppedAt == null).length < MAX_LANES;
  if (canAdd) $('strip').insertAdjacentHTML('beforeend', '<button class="plus" data-add="1" title="Add another AI — it answers your latest message in a new column">＋</button>');
  // rows
  const html = [];
  if (!T.rows.length) html.push('<div class="prompt" style="width:' + $('grid').clientWidth + 'px;justify-content:center"><div class="hello"><h1>' + esc(CFG.greeting || 'What can I help with?') + '</h1><p class="muted small">' + (multi ? 'Everything you send goes to every AI above. ✕ stops one; its column stays so the answers keep lining up.' : 'Ask anything. Then tap ＋ beside the answer to ask another AI the same thing — its answer lands in a column next to it.') + '</p><div class="starters">' + (CFG.starters || []).map((s) => '<button data-start="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div></div></div>');
  T.rows.forEach((r, ri) => {
    if (r.type === 'prompt') { html.push('<div class="prompt" style="width:' + $('grid').clientWidth + 'px"><div class="promptin"><div class="bub">' + ((r.images || r.thumbs || []).length ? '<div class="pics">' + (r.images || r.thumbs).map((u, k) => '<img src="' + u + '" data-big="' + ri + ':' + k + '" alt="">').join('') + '</div>' : '') + esc(r.text) + '</div></div></div>'); return; }
    html.push('<div class="answers">' + T.lanes.map((l, li) => {
      const c = r.cells[li], m = modelOf(l.model);
      if (!c) return '<div class="cell empty" style="width:' + cw + 'px">' + (ri < (l.from || 0) ? 'joined later' : l.stoppedAt != null && ri >= l.stoppedAt ? 'stopped' : '—') + '</div>';
      const who = '<div class="who">' + esc(m.name) + '</div>';
      if (c.state === 'wait') return '<div class="cell" style="width:' + cw + 'px">' + who + '<span class="dots"></span></div>';
      if (c.state === 'err') return '<div class="cell err" style="width:' + cw + 'px">' + who + esc(c.text) + '<div class="foot"><button data-retry="' + ri + ':' + li + '">Try again</button></div></div>';
      return '<div class="cell" style="width:' + cw + 'px">' + who + (c.blind ? '<span class="blind" title="This model only reads words, so it answered without the picture">🙈 can’t see images</span>' : '') + '<div class="md">' + md(c.text) + (c.state === 'stream' ? ' <span class="dots"></span>' : '') + '</div>'
        + (c.state === 'done' ? '<div class="foot">' + (c.ms ? '<span>' + (c.ms / 1000).toFixed(1) + ' s</span>' : '') + '<span>' + c.text.split(/\s+/).filter(Boolean).length + ' words</span><button data-copy="' + ri + ':' + li + '">Copy</button>' + (ri === lastRow - 1 && alive(l, ri + 1) ? '<button data-retry="' + ri + ':' + li + '">↻</button>' : '') + '</div>' : '') + '</div>';
    }).join('') + (ri === lastRow - 1 && canAdd ? '<div class="cell plus"><button data-add="1" title="Ask another AI the same thing — its answer goes in a new column">＋</button></div>' : '') + '</div>');
  });
  $('rows').innerHTML = html.join('');
  syncStrip();
  wire();
}
function syncStrip() { $('strip').style.transform = 'translateX(' + (-$('grid').scrollLeft) + 'px)'; }
$('grid').addEventListener('scroll', syncStrip, { passive: true });
addEventListener('resize', () => render());

function wire() {
  document.querySelectorAll('[data-stop]').forEach((b) => b.onclick = () => stopLane(+b.dataset.stop));
  document.querySelectorAll('[data-swap]').forEach((b) => b.onclick = () => { if (!b.disabled) pickModel((id) => { T.lanes[+b.dataset.swap].model = id; save(); render(); }); });
  document.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => pickModel(addLane));
  document.querySelectorAll('[data-big]').forEach((im) => im.onclick = () => { const [ri, k] = im.dataset.big.split(':').map(Number); const r = T.rows[ri]; const u = (r.images || r.thumbs)[k]; sheet('<h2>Picture <button class="ghost" onclick="closeSheet()">✕</button></h2><img src="' + u + '" style="max-width:100%;border-radius:12px;display:block;margin:0 auto">'); });
  document.querySelectorAll('[data-start]').forEach((b) => b.onclick = () => send(b.dataset.start));
  document.querySelectorAll('[data-retry]').forEach((b) => b.onclick = () => { const [ri, li] = b.dataset.retry.split(':').map(Number); ask(ri, li); });
  document.querySelectorAll('[data-copy]').forEach((b) => b.onclick = async () => { const [ri, li] = b.dataset.copy.split(':').map(Number); try { await navigator.clipboard.writeText(T.rows[ri].cells[li].text); toast('Copied'); } catch { toast('Couldn’t copy'); } });
}

// ---------- the conversation one AI sees ----------
// Your messages, and its own answers. For a row it has no answer to (it joined later), the answer from the
// first column that has one — so it isn't reading a conversation with holes in it.
function historyFor(li, uptoRow) {
  const msgs = [];
  for (let i = 0; i <= uptoRow && i < T.rows.length; i++) {
    const r = T.rows[i];
    if (r.type === 'prompt') { msgs.push({ role: 'user', content: r.text || '(a picture)' }); continue; }
    if (i >= uptoRow) break;
    const own = r.cells[li]?.state === 'done' ? r.cells[li] : null;
    const other = own || Object.values(r.cells).find((c) => c && c.state === 'done' && c.text);
    if (other) msgs.push({ role: 'assistant', content: other.text });
  }
  // two user turns in a row (an answer failed): join them, the API wants turns to alternate
  const out = [];
  for (const m of msgs) { const prev = out[out.length - 1]; if (prev && prev.role === m.role) prev.content += '\n\n' + m.content; else out.push({ ...m }); }
  return out;
}

// Ask one AI (column li) for the answer in row ri (an 'answers' row, right after its prompt).
async function ask(ri, li) {
  const key = ri + ':' + li; if (busy.has(key)) return;
  const lane = T.lanes[li], row = T.rows[ri];
  row.cells[li] = { text: '', state: 'wait' }; render();
  const messages = historyFor(li, ri);
  // The pictures sent with this row's message: to a model that can see; one that can't answers the words.
  const pr = T.rows[ri - 1], imgs = pr && pr.type === 'prompt' ? (pr.images || []) : [];
  const hadPics = Boolean(pr && pr.type === 'prompt' && (pr.images || pr.thumbs || []).length);
  const sees = Boolean(modelOf(lane.model).sees && imgs.length);
  busy.add(key); const t0 = Date.now(), thread = T;
  let text = '', ok = false, reason = '';
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json', ...H() }, body: JSON.stringify({ project: BOT, model: lane.model, messages, stream: true, ...(sees ? { images: imgs } : {}) }) });
    if (r.status === 401 || r.status === 403) { const d = await r.json().catch(() => ({})); reason = d.reply || 'Sign in again to keep chatting.'; if (r.status === 401) showSignin(); }
    else if (r.status === 429) { reason = 'Too many messages at once — wait a moment, then try again.'; }
    else if (!r.ok || !r.body) { const d = await r.json().catch(() => ({})); reason = d.reply || d.error || ('The server said ' + r.status + '.'); }
    else {
      const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '', last = 0;
      for (;;) {
        const { value, done } = await rd.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf('\n\n')) >= 0) {
          const ev = buf.slice(0, i); buf = buf.slice(i + 2);
          for (const line of ev.split('\n')) {
            if (!line.startsWith('data:')) continue;
            let d; try { d = JSON.parse(line.slice(5).trim()); } catch { continue; }
            if (d.type === 'delta' && d.text) text += d.text;
            if (d.type === 'final') { text = d.text || text; ok = true; }
          }
        }
        if (thread === T && Date.now() - last > 120) { row.cells[li] = { text, state: 'stream' }; render(); last = Date.now(); }
      }
      if (!ok && text) ok = true;
      if (!ok) reason = 'No answer came back. Try again.';
    }
  } catch { reason = 'Couldn’t reach the server. Try again.'; }
  busy.delete(key);
  row.cells[li] = ok && text.trim() ? { text: text.trim(), state: 'done', ms: Date.now() - t0, blind: hadPics && !sees } : { text: reason || 'Empty answer. Try again.', state: 'err' };
  if (thread === T) render();
  if (![...busy].length) save(thread);
}

function send(text) {
  text = String(text || '').trim(); if ((!text && !PICS.length) || !T) return;
  if ([...busy].length) return toast('Still answering — one moment.');
  const pics = PICS.splice(0); drawTray();
  if (!text && pics.length) text = 'What’s in ' + (pics.length > 1 ? 'these pictures' : 'this picture') + '?';
  if (pics.length && !T.lanes.some((l) => l.stoppedAt == null && modelOf(l.model).sees)) toast('None of these AIs can see pictures — they’ll answer the words. Tap ＋ to add one that can.', 4500);
  T.rows.push({ type: 'prompt', text, images: pics.map((p) => p.full), thumbs: pics.map((p) => p.thumb) });
  const ri = T.rows.push({ type: 'answers', cells: {} }) - 1;
  if (!T.title) T.title = text.slice(0, 60);
  render(); scrollDown();
  T.lanes.forEach((l, li) => { if (alive(l, ri)) ask(ri, li); });
}
function scrollDown() { requestAnimationFrame(() => scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' })); }

function addLane(model) {
  const lastAns = T.rows.length - 1;
  T.lanes.push({ model, stoppedAt: null, from: T.rows.length ? lastAns : 0 });
  render();
  // Straight into the latest row: it answers your last message, like the others did.
  if (T.rows.length && T.rows[lastAns]?.type === 'answers') ask(lastAns, T.lanes.length - 1);
  else save();
  requestAnimationFrame(() => $('grid').scrollTo({ left: $('grid').scrollWidth, behavior: 'smooth' }));
}
function stopLane(li) {
  const l = T.lanes[li]; if (!l || l.stoppedAt != null) return;
  // Stopped after the row it's on: its answers stay, the next message skips it.
  l.stoppedAt = T.rows.length + 1;
  save(); render(); toast(modelOf(l.model).name + ' stopped — it won’t get your next message.');
}

// ---------- the model picker ----------
function pickModel(then) {
  const draw = (q) => {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    const list = MODELS.filter((m) => words.every((w) => (m.name + ' ' + m.maker + ' ' + m.id + ' ' + m.description).toLowerCase().includes(w)));
    $('mlist').innerHTML = list.map((m) => '<button data-m="' + esc(m.id) + '"><span><b>' + esc(m.name) + (m.id === DEFAULT_MODEL ? '<span class="tag">default</span>' : '') + (m.sees ? '<span class="tag">sees images</span>' : '') + (m.thinks ? '<span class="tag">thinks first</span>' : '') + (m.beta ? '<span class="tag">beta</span>' : '') + '</b><small>' + esc(m.maker) + (m.description ? ' · ' + esc(m.description.slice(0, 120)) : '') + '</small></span><span class="price">' + esc(priceLine(m)) + '<br><small>per million tokens</small></span></button>').join('') || '<p class="muted small">No model matches that.</p>';
    $('mlist').querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { closeSheet(); then(b.dataset.m); });
  };
  sheet('<h2>Pick an AI <button class="ghost" onclick="closeSheet()">✕</button></h2><p class="muted small" style="margin-top:0">Every text model Cloudflare runs on this account. Prices are what Cloudflare charges; a “thinks first” model reasons before it answers — slower, sometimes better.</p><input type="search" id="mq" placeholder="Search — llama, qwen, code, fast…"><div class="mlist" id="mlist"></div>');
  $('mq').oninput = () => draw($('mq').value); draw('');
  if (matchMedia('(hover: hover)').matches) $('mq').focus();
}
function sheet(html) { $('sheetbody').innerHTML = html; $('sheet').hidden = false; }
function closeSheet() { $('sheet').hidden = true; }
$('sheet').onclick = (e) => { if (e.target === $('sheet')) closeSheet(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

// ---------- history (the server's, per person) ----------
// A saved chat is the Assistant's ordinary thread: your messages and the answers in order, each answer
// marked with its model and column. The main page shows the same chats (as one long conversation).
function toMessages(t) {
  const out = [];
  t.rows.forEach((r) => {
    if (r.type === 'prompt') out.push({ role: 'user', content: r.text, ...(r.thumbs && r.thumbs.length ? { thumbs: r.thumbs } : {}) });
    else Object.entries(r.cells).sort((a, b) => a[0] - b[0]).forEach(([li, c]) => { if (c && c.state === 'done') out.push({ role: 'assistant', content: c.text, model: t.lanes[li]?.model, lane: +li, ...(c.blind ? { blind: true } : {}) }); });
  });
  return out.slice(-200);
}
function fromThread(th) {
  const lanes = Array.isArray(th.lanes) && th.lanes.length ? th.lanes.map((l) => ({ model: l.model || DEFAULT_MODEL, stoppedAt: Number.isInteger(l.stoppedAt) ? l.stoppedAt : null, from: l.from || 0 })) : [{ model: DEFAULT_MODEL, stoppedAt: null, from: 0 }];
  const rows = [];
  for (const m of th.messages || []) {
    if (m.role === 'user') { rows.push({ type: 'prompt', text: m.content, thumbs: Array.isArray(m.thumbs) ? m.thumbs : [] }); rows.push({ type: 'answers', cells: {} }); continue; }
    if (m.role !== 'assistant') continue;
    if (!rows.length) rows.push({ type: 'answers', cells: {} });
    let li = Number.isInteger(m.lane) ? m.lane : lanes.findIndex((l) => l.model === m.model);
    if (li < 0) li = 0;
    while (li >= lanes.length) lanes.push({ model: m.model || DEFAULT_MODEL, stoppedAt: null, from: 0 });
    rows[rows.length - 1].cells[li] = { text: m.content, state: 'done', blind: Boolean(m.blind) };
  }
  return { id: th.id, title: th.title || '', lanes, rows };
}
async function save(t = T) {
  if (!t || !t.rows.some((r) => r.type === 'prompt')) return;
  try {
    const r = await fetch('/api/chats/' + encodeURIComponent(t.id), { method: 'PUT', headers: { 'content-type': 'application/json', ...H() }, body: JSON.stringify({ bot: BOT, title: t.title, messages: toMessages(t), meta: { lanes: t.lanes } }) });
    if (r.ok) { const i = THREADS.findIndex((x) => x.id === t.id); const row = { id: t.id, title: t.title, updated_at: new Date().toISOString(), _t: t }; if (i >= 0) THREADS.splice(i, 1); THREADS.unshift(row); }
  } catch {}
}
async function loadThreads() {
  try { const r = await fetch('/api/chats?bot=' + BOT, { headers: H() }); if (r.ok) THREADS = (await r.json()).threads || []; } catch {}
}
function openHistory() {
  const draw = (q) => {
    const list = THREADS.filter((t) => !q || (t.title || '').toLowerCase().includes(q.toLowerCase()));
    $('tlist').innerHTML = list.map((t) => { const lanes = (t._t ? t._t.lanes : t.lanes) || []; return '<div class="t' + (T && t.id === T.id ? ' on' : '') + '" data-open="' + esc(t.id) + '"><span><b>' + esc(t.title || 'Untitled') + '</b><small>' + new Date(t.updated_at).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + (lanes.length > 1 ? ' · ' + lanes.length + ' AIs' : '') + '</small></span><button class="del" data-del="' + esc(t.id) + '" title="Delete this chat">✕</button></div>'; }).join('') || '<p class="muted small">No chats yet.</p>';
    $('tlist').querySelectorAll('[data-open]').forEach((el) => el.onclick = (e) => { if (e.target.dataset.del) return; const th = THREADS.find((x) => x.id === el.dataset.open); if (!th) return; T = th._t || fromThread(th); th._t = T; closeSheet(); setUrl(); render(); scrollDown(); });
    $('tlist').querySelectorAll('[data-del]').forEach((b) => b.onclick = (e) => {
      e.stopPropagation();
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Delete?'; b.style.color = 'var(--danger)'; setTimeout(() => { b.dataset.sure = ''; b.textContent = '✕'; b.style.color = ''; }, 3000); return; }
      fetch('/api/chats/' + encodeURIComponent(b.dataset.del) + '?bot=' + BOT, { method: 'DELETE', headers: H() });
      THREADS = THREADS.filter((x) => x.id !== b.dataset.del); if (T && T.id === b.dataset.del) newChat(); draw($('tq').value);
    });
  };
  sheet('<h2>Your chats <button class="ghost" onclick="closeSheet()">✕</button></h2><input type="search" id="tq" placeholder="Search your chats"><div class="tlist" id="tlist"></div>');
  $('tq').oninput = () => draw($('tq').value); draw('');
}
function newChat(lanes) {
  T = { id: newId(), title: '', lanes: lanes || [{ model: (T && T.lanes.find((l) => l.stoppedAt == null)?.model) || DEFAULT_MODEL, stoppedAt: null, from: 0 }], rows: [] };
  setUrl(); render(); scrollTo({ top: 0 });
}
function setUrl() { if (T) history.replaceState(null, '', '/chat/' + (T.rows.length ? T.id : '')); }
$('histbtn').onclick = openHistory;

$('newbtn').onclick = () => newChat();

// ---------- the composer ----------
const input = $('input');
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, innerHeight * 0.4) + 'px'; });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(hover: hover)').matches) { e.preventDefault(); $('say').requestSubmit(); } });
$('say').onsubmit = (e) => { e.preventDefault(); const v = input.value; if (!v.trim() && !PICS.length) return; input.value = ''; input.dispatchEvent(new Event('input')); send(v); setUrl(); };

// ---------- pictures: shrunk here (1024 px for the model, 160 px kept with the chat) ----------
let PICS = [];
async function shrinkTo(file, max, q) {
  let src = await createImageBitmap(file).catch(() => null);
  if (!src) src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement('canvas'); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function addPics(files) {
  for (const f of [...files].filter((f) => /^image\//.test(f.type) || /\.(heic|heif)$/i.test(f.name))) {
    if (PICS.length >= 4) { toast('Four pictures at most per message.'); break; }
    try { PICS.push({ full: await shrinkTo(f, 1024, 0.82), thumb: await shrinkTo(f, 160, 0.6) }); } catch { toast('That picture couldn’t be opened.'); }
  }
  drawTray();
}
function drawTray() {
  $('tray').hidden = !PICS.length;
  $('tray').innerHTML = PICS.map((p, i) => '<div class="t"><img src="' + p.thumb + '" alt=""><button type="button" data-rmpic="' + i + '" title="Remove">✕</button></div>').join('');
  $('tray').querySelectorAll('[data-rmpic]').forEach((b) => b.onclick = () => { PICS.splice(+b.dataset.rmpic, 1); drawTray(); });
}
$('picbtn').onclick = () => $('picfile').click();
$('picfile').onchange = () => { addPics($('picfile').files); $('picfile').value = ''; };
document.addEventListener('paste', (e) => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); addPics(fs); } });
document.addEventListener('dragover', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); document.body.classList.add('dropping'); } });
document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('dropping'); });
document.addEventListener('drop', (e) => { if (e.dataTransfer?.files?.length) { e.preventDefault(); document.body.classList.remove('dropping'); addPics(e.dataTransfer.files); } });

// Voice: record, send the clip to this Worker (/api/transcribe), the words land in the box to check and send.
let rec = null;
$('mic').onclick = async () => {
  if (rec) { try { rec.stop(); } catch {} return; }
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { $('mic').hidden = true; return toast('No microphone — typing works as usual.'); }
  const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported?.(t));
  const chunks = []; rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
  rec.ondataavailable = (e) => { if (e.data?.size) chunks.push(e.data); };
  rec.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop()); const r0 = rec; rec = null; $('mic').classList.remove('rec'); $('mic').textContent = '…'; $('hint').textContent = '';
    const blob = new Blob(chunks, { type: r0.mimeType || type || 'audio/webm' });
    const fd = new FormData(); fd.append('audio', blob, 'clip.' + ((blob.type.split('/')[1] || 'webm').split(';')[0])); fd.append('project', BOT);
    let d = {}; try { const r = await fetch('/api/transcribe', { method: 'POST', headers: H(), body: fd }); d = await r.json().catch(() => ({})); } catch {}
    $('mic').textContent = '🎤';
    if (!d.text) return toast(d.reason || 'I couldn’t make that out. Try again, or type it.');
    input.value = (input.value.trim() ? input.value.replace(/\s*$/, ' ') : '') + d.text; input.dispatchEvent(new Event('input')); input.focus();
  };
  rec.start(); $('mic').classList.add('rec'); $('mic').textContent = '■'; $('hint').textContent = 'Listening… press ■ when you’re done';
  setTimeout(() => { if (rec) try { rec.stop(); } catch {} }, 60000);
};

// ---------- start ----------
function showSignin() { $('signin').hidden = false; $('main').hidden = true; $('dock').hidden = true; $('histbtn').hidden = $('newbtn').hidden = true; }
(async function boot() {
  let me = {};
  try { me = await (await fetch('/api/id/me?bot=' + BOT, { headers: H() })).json(); } catch {}
  if (!me.linked) return showSignin();
  let voiceIn = false;
  try { const c = await (await fetch('/api/config?project=' + BOT, { headers: H() })).json(); CFG = (c.projects || []).find((p) => p.id === BOT) || {}; if (c.siteName) $('sitename').textContent = c.siteName; voiceIn = Boolean(c.voice?.enabled && c.voice?.in); } catch {}
  try { const m = await (await fetch('/api/models')).json(); MODELS = m.models || []; DEFAULT_MODEL = m.default || MODELS[0]?.id || ''; } catch {}
  $('main').hidden = false; $('dock').hidden = false;
  $('mic').hidden = !(voiceIn && window.MediaRecorder && navigator.mediaDevices?.getUserMedia);
  await loadThreads();
  const want = location.pathname.split('/')[2];
  const th = want && THREADS.find((t) => t.id === want);
  if (th) { T = fromThread(th); th._t = T; render(); scrollDown(); } else newChat();
})();
</script>
